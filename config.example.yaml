# Copy to config.yaml and edit. config.yaml is gitignored because it contains your server's IDs.
# Get IDs: Discord -> User Settings -> Advanced -> Developer Mode, then right-click -> Copy ID.

# The single server this bot serves. Messages from any other server are ignored.
guild_id: 123456789012345678

# Channels where dropped files and links are ingested into the vault.
watched_channels:
  - 123456789012345678   # #drops
  - 123456789012345678   # #meetings

# Channels whose chat history is archived (raw daily logs + LLM digests).
archived_channels:
  - 123456789012345678   # #general
  - 123456789012345678   # #dev

# Who may run slash commands (/ask, /decide, /digest, /backfill, /sync, /ingest, /retry, /reingest, /status).
# Anyone in a watched channel may drop files regardless of this list.
allowed_role_ids: []
allowed_user_ids:
  - 123456789012345678

# Map Discord user ids to canonical people names. Seeds people/ notes and makes chat logs link authors.
people:
  "123456789012345678": "Jordan Blake"

# URL hosts the bot will download from when a link is posted in a watched channel.
# Any URL whose path ends in a supported file extension is also accepted.
url_hosts:
  - youtube.com
  - youtu.be
  - loom.com
  - drive.google.com
  - docs.google.com

# IANA timezone used for chat day boundaries and timestamps in logs.
timezone: America/New_York

# Chat archiving
sync_interval_hours: 6      # incremental history sync cadence
digest_min_messages: 5      # a day needs at least this many messages to get an LLM digest
digest_regen_delta: 10      # re-digest an already digested day if it grew by this many messages

# Ingestion tunables
memo_max_minutes: 5         # audio shorter than this is a "memo", longer is a "recording"

# Where /decide posts the decision card (default: the channel the command was run in).
decisions_channel_id: 123456789012345678   # #key-decisions

# /ask: how much of the vault Claude sees per question.
ask:
  max_notes: 12
  budget_chars: 120000
  note_chars: 12000

# /task board: cards, the pinned open-task list and the morning reminder go here.
tasks:
  channel_id: 123456789012345678   # #tasks
  reminder_hour: 9                 # daily, in `timezone`, only when something is due or overdue
  reminder_weekdays_only: true
  suggest_from_notes: true   # action items in new notes become ✅/❌ suggestion cards
  suggest_max_per_note: 8

# Meeting capture: /record start|stop|status in a voice channel. One Whisper track per speaker.
meetings:
  max_minutes: 180
  announce: true       # tell the voice channel it is being recorded (all-party consent states!)

# Scheduled week-in-review post. Leave channel_id unset to disable. /digest builds one on demand.
weekly_digest:
  channel_id: 123456789012345678   # #announcements
  weekday: 0        # 0 = Monday ... 6 = Sunday, in `timezone`
  hour: 8
  days: 7

llm:
  single_call_max_chars: 400000   # above this, transcripts are chunked (map) and merged (reduce)
  chunk_chars: 200000
  chunk_overlap_chars: 2000

transcription:
  language: null              # e.g. "en"; null = auto-detect
  diarize: true               # only takes effect when HF_TOKEN is set

vault:
  keep_originals_max_mb: 25   # copy non-media originals into vault/attachments/ up to this size
