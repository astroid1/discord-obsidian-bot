[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-obsidian-bot"
version = "0.1.0"
description = "Drop files, links and chat into Discord; get a linked Obsidian knowledge base."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "astroid1" }]
keywords = ["discord", "obsidian", "whisper", "knowledge-base", "transcription"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "discord.py>=2.7,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "anthropic>=1.0,<2",
  "httpx>=0.27",
  "yt-dlp>=2025.1",
  "pymupdf>=1.25",
  "python-docx>=1.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
gpu = [
  "faster-whisper>=1.2,<2",
  "torch>=2.8",
  "torchaudio>=2.8",
  "torchcodec>=0.7",
  "pyannote.audio>=4.0,<5",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pre-commit>=4",
]

[project.scripts]
dob = "dob.__main__:main"

[project.urls]
Homepage = "https://github.com/astroid1/discord-obsidian-bot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dob = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
