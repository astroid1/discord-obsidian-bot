name: discord-obsidian-bot  # pinned so volume names never depend on the folder name

services:
  bot:
    build: .
    image: discord-obsidian-bot
    container_name: discord-obsidian-bot
    env_file: .env
    environment:
      # Container-side paths (override whatever .env says for native runs).
      VAULT_PATH: /vault
      DATA_PATH: /data
      INBOX_PATH: /inbox
      MODELS_PATH: /models
      CONFIG_PATH: /app/config.yaml
      INBOX_FORCE_POLLING: "true"
    volumes:
      # Your Obsidian vault on the host (set VAULT_HOST_PATH in .env, e.g. C:/Users/you/Vaults/company-kb)
      - ${VAULT_HOST_PATH:-./tmp-vault}:/vault
      # Drop huge files here to bypass Discord's upload limit
      - ./inbox:/inbox
      - ./config.yaml:/app/config.yaml:ro
      # Named volumes: SQLite state and the multi-GB whisper/pyannote model cache stay on the
      # Linux side, which is much faster than a Windows bind mount.
      - dob-data:/data
      - dob-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  dob-data:
  dob-models:
